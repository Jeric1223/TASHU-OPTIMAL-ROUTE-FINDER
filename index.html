<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#006a3c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- black-translucent는 홈 화면 앱에서 콘텐츠를 상태바 밑부터 그리면서 레이아웃 높이는
         상태바만큼 짧게 잡아, 하단 탭바 아래에 상태바 높이(59pt)만큼 빈 띠가 남는다. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- SEO -->
    <title>타슈 최적 경로 찾기 | 대전 공공자전거</title>
    <meta name="description" content="대전시 공공자전거 타슈의 가장 가까운 정류소를 찾고, 최적 경로를 안내받으세요. PWA 앱으로 홈화면에 추가 가능." />
    <meta name="keywords" content="타슈, TASHU, 대전, 공공자전거, 자전거 대여, 경로 찾기" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="타슈 최적 경로 찾기" />
    <meta property="og:description" content="대전시 공공자전거 타슈의 최적 경로를 찾아보세요" />
    <meta property="og:image" content="/icons/icon-512x512.png" />

    <!-- Fonts: Pretendard Variable + 동적 서브셋 (실제 쓰는 글자 범위만 받음) -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />

    <!-- Custom Styles -->
    <style>
      /* 타이포 기본값 — 가변 폰트 + 자간 정리 */
      html {
        font-family: 'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }

      /* 숫자 폭 고정 — 대여 가능 대수가 갱신될 때 레이아웃이 흔들리지 않게 */
      body {
        font-variant-numeric: tabular-nums;
      }

      /* 큰 글자는 자간을 좁혀야 덩어리로 읽힌다 */
      h1, h2, h3 {
        letter-spacing: -0.022em;
      }

      /* MapLibre 팝업 — 그림자 없이 1px 보더로 (그림자는 바텀시트에만 허용) */
      .maplibregl-popup-content {
          background: #ffffff;
          color: #14171c;
          border-radius: 12px;
          box-shadow: none;
          border: 1px solid #e2e5e9;
          padding: 12px 16px;
          font-family: 'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
          min-width: 200px;
      }
      .maplibregl-popup-anchor-top .maplibregl-popup-tip { border-bottom-color: #e2e5e9; }
      .maplibregl-popup-anchor-bottom .maplibregl-popup-tip { border-top-color: #e2e5e9; }
      .maplibregl-popup-anchor-left .maplibregl-popup-tip { border-right-color: #e2e5e9; }
      .maplibregl-popup-anchor-right .maplibregl-popup-tip { border-left-color: #e2e5e9; }
      .maplibregl-popup-close-button {
          color: #9ca3af;
          font-size: 18px;
          line-height: 1;
          padding: 4px 8px;
          border-radius: 9999px;
          background: transparent;
      }
      .maplibregl-popup-close-button:hover {
          background-color: #f3f4f6;
          color: #374151;
      }

      html, body {
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }

      #root {
        display: flex;
        flex-direction: column;
        height: 100vh;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
